name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v
      - name: Smoke-test installed console script on this real Linux runner
        run: |
          reboot-safety-check --version
          reboot-safety-check --help
          reboot-safety-check --json | python -m json.tool > /dev/null
          reboot-safety-check; echo "exit code: $?"

  build-artifact:
    name: build wheel + sdist + pyz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build standalone .pyz (zipapp)
        run: |
          python -m pip install --target build/pyz-deps .
          printf 'from reboot_safety_check.cli import main\nif __name__ == "__main__":\n    raise SystemExit(main())\n' > build/pyz-deps/__main__.py
          python -m zipapp build/pyz-deps -o dist/reboot-safety-check.pyz -p "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/reboot-safety-check.pyz --version
          python3 dist/reboot-safety-check.pyz --json | python3 -m json.tool > /dev/null
          # Regression check: the .pyz's exit code must reflect the real
          # command result, not always be 0 (zipapp's --main template
          # omits sys.exit(), which previously made every .pyz invocation
          # report success regardless of actual findings/errors). An
          # unrecognized flag is a deterministic nonzero (argparse error) case.
          set +e
          python3 dist/reboot-safety-check.pyz --bogus-flag-xyz > /dev/null 2>&1
          bogus_code=$?
          set -e
          test "$bogus_code" -ne 0
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
